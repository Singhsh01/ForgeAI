# Optional: PostgreSQL instead of the embedded PGlite database, plus an OTLP collector.
#   docker compose up -d postgres jaeger
#   DATABASE_URL=postgres://forgeai:forgeai@localhost:5432/forgeai
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318/v1/traces
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forgeai
      POSTGRES_PASSWORD: forgeai
      POSTGRES_DB: forgeai
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeai"]
      interval: 5s
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:16686:16686", "127.0.0.1:4318:4318"]
volumes:
  pgdata:
